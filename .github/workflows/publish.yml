name: Publish & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# ============================================================
# Deploy Configuration
# ============================================================
# PACKAGE_NAME:        npm package published by this repo (always set)
# WORKER_PACKAGE_NAME: worker package name, if this repo also publishes a worker
#                      (leave empty if no worker)
# PM2_SERVICE_NAME:    PM2 service to redeploy on hadoku-server
#                      (leave empty if no tunnel service)
env:
  PACKAGE_NAME: "@wolffm/study"
  WORKER_PACKAGE_NAME: "@wolffm/study-worker"
  PM2_SERVICE_NAME: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Self-hosted by default; `vars.CI_RUNNER` is the on-demand escape hatch
    # and mgmt-api flips it to hosted automatically if every claw is offline.
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          # The whole history, because "what changed" is measured across the
          # PUSH and a push can be any number of commits. See the range step.
          fetch-depth: 0

      - uses: WolffM/hadoku-actions/setup-pnpm@v1
        with:
          npm-token: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Build UI package
        run: pnpm run build

      - name: Build worker package
        if: env.WORKER_PACKAGE_NAME != ''
        run: pnpm --filter ${{ env.WORKER_PACKAGE_NAME }} run build

      # What this PUSH introduced, as a diff range.
      #
      # `HEAD~1 HEAD` is the last COMMIT, and a push is not one commit. Push
      # two commits where the worker changes in the first and a chore lands
      # second, and the worker publish is silently skipped — the UI ships the
      # new feature and the worker that implements it never leaves the runner.
      #
      # It fails QUIETLY by construction: the publish, the registry
      # verification and the dispatch to hadoku_site are all gated on the two
      # outputs below, so they agree with each other and none of them agrees
      # with the push. Green run, published UI, an API that 400s on the thing
      # the UI now offers. Seen for real in hadoku-meet (2026-08-18) and
      # hadoku-hopper (2026-09-01), whose worker sat unpublished while the site
      # ran a new client against it.
      #
      # `github.event.before` is the tip before the push, the only base that
      # covers every commit in it.
      - name: Resolve the range this push introduced
        id: range
        run: |
          base="${{ github.event.before }}"
          # workflow_dispatch sends no `before`; a branch's first push sends the
          # all-zero sha; a force-push can name a commit that is no longer
          # reachable. Fall back to the last commit in all three cases — a
          # narrower range than the truth, but never a broken one.
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable push base ('$base'); falling back to HEAD~1"
            base="HEAD~1"
          fi
          echo "base=$base" >> $GITHUB_OUTPUT
          echo "Comparing ${base}..HEAD:"
          git diff --name-only "$base" HEAD

      - name: Check if UI package changed
        id: ui_changed
        run: |
          if git diff --name-only ${{ steps.range.outputs.base }} HEAD | grep -qv '^worker/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if worker package changed
        id: worker_changed
        run: |
          if git diff --name-only ${{ steps.range.outputs.base }} HEAD | grep -q '^worker/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check and bump UI version if needed
        if: steps.ui_changed.outputs.changed == 'true'
        run: |
          package_name=$(node -p "require('./package.json').name")
          current_version=$(node -p "require('./package.json').version")
          echo "Current version: $current_version"
          # Loop until we find an unpublished version. A single-step bump is
          # insufficient: if the pre-commit hook was skipped and a prior CI
          # run already burned current+1, we'd write a duplicate version and
          # pnpm publish silently no-ops ("There are no new packages").
          #
          # START FROM THE REGISTRY, NOT FROM package.json. The bump below is
          # published but never committed back, so the committed version only
          # falls further behind the registry — and a walk that starts there
          # replays the whole gap one patch at a time on every publish. That
          # is how tenhands died at attempt 99 having published nothing on
          # 2026-08-05. From the registry's latest the walk takes one step,
          # so ten consecutive collisions means something is genuinely wrong.
          latest_published=$(pnpm view "${package_name}" version 2>/dev/null || true)
          # pnpm prints fetch errors to STDOUT: for a never-published package the
          # capture is "[ERR_PNPM_FETCH_404] ... Not Found - 404", and sort -V
          # would crown that string the version to publish (first-publish of
          # @wolffm/meet died exactly this way). Only a bare semver may seed the walk.
          if ! printf '%s' "$latest_published" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            latest_published=""
          fi
          if [ -n "$latest_published" ]; then
            new_version=$(printf '%s\n%s\n' "$current_version" "$latest_published" | sort -V | tail -1)
            echo "Registry latest: $latest_published; starting walk at $new_version"
          else
            echo "No published version found; starting from package.json"
            new_version="$current_version"
          fi
          max_attempts=10
          attempt=0
          while pnpm view "${package_name}@${new_version}" version 2>/dev/null; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "ERROR: $max_attempts consecutive published versions from $new_version."
              echo "Starting at the registry's latest this should take one step, so the"
              echo "registry lookup most likely failed and the walk began from a stale base."
              exit 1
            fi
            echo "Version $new_version already published, bumping... ($attempt/$max_attempts)"
            major=$(echo $new_version | cut -d. -f1)
            minor=$(echo $new_version | cut -d. -f2)
            patch=$(echo $new_version | cut -d. -f3)
            if [ $patch -ge 20 ]; then
              new_minor=$((minor + 1))
              new_version="$major.$new_minor.0"
            else
              new_patch=$((patch + 1))
              new_version="$major.$minor.$new_patch"
            fi
          done
          if [ "$new_version" != "$current_version" ]; then
            node -e "const fs = require('fs'); const p = 'package.json'; const src = fs.readFileSync(p, 'utf8'); const next = src.replace(/(\"version\"\s*:\s*\")[^\"]*(\")/, (m, a, b) => a + process.argv[1] + b); if (next === src) { console.error('could not patch version in ' + p); process.exit(1); } fs.writeFileSync(p, next);" "$new_version"
            echo "Version bumped: $current_version -> $new_version"
            pnpm install --lockfile-only
          else
            echo "Version $current_version not published yet"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Check and bump worker version if needed
        if: env.WORKER_PACKAGE_NAME != '' && steps.worker_changed.outputs.changed == 'true'
        run: |
          package_name=$(node -p "require('./worker/package.json').name")
          current_version=$(node -p "require('./worker/package.json').version")
          echo "Current worker version: $current_version"
          # See UI bump step for the rationale on looping and on starting the
          # walk from the registry's latest rather than the committed version.
          latest_published=$(pnpm view "${package_name}" version 2>/dev/null || true)
          # pnpm prints fetch errors to STDOUT: for a never-published package the
          # capture is "[ERR_PNPM_FETCH_404] ... Not Found - 404", and sort -V
          # would crown that string the version to publish (first-publish of
          # @wolffm/meet died exactly this way). Only a bare semver may seed the walk.
          if ! printf '%s' "$latest_published" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            latest_published=""
          fi
          if [ -n "$latest_published" ]; then
            new_version=$(printf '%s\n%s\n' "$current_version" "$latest_published" | sort -V | tail -1)
            echo "Registry latest: $latest_published; starting walk at $new_version"
          else
            echo "No published version found; starting from package.json"
            new_version="$current_version"
          fi
          max_attempts=10
          attempt=0
          while pnpm view "${package_name}@${new_version}" version 2>/dev/null; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "ERROR: $max_attempts consecutive published versions from $new_version."
              echo "Starting at the registry's latest this should take one step, so the"
              echo "registry lookup most likely failed and the walk began from a stale base."
              exit 1
            fi
            echo "Version $new_version already published, bumping... ($attempt/$max_attempts)"
            major=$(echo $new_version | cut -d. -f1)
            minor=$(echo $new_version | cut -d. -f2)
            patch=$(echo $new_version | cut -d. -f3)
            if [ $patch -ge 20 ]; then
              new_minor=$((minor + 1))
              new_version="$major.$new_minor.0"
            else
              new_patch=$((patch + 1))
              new_version="$major.$minor.$new_patch"
            fi
          done
          if [ "$new_version" != "$current_version" ]; then
            node -e "const fs = require('fs'); const p = 'worker/package.json'; const src = fs.readFileSync(p, 'utf8'); const next = src.replace(/(\"version\"\s*:\s*\")[^\"]*(\")/, (m, a, b) => a + process.argv[1] + b); if (next === src) { console.error('could not patch version in ' + p); process.exit(1); } fs.writeFileSync(p, next);" "$new_version"
            echo "Worker version bumped: $current_version -> $new_version"
            pnpm install --lockfile-only
          else
            echo "Version $current_version not published yet"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Publish UI package
        if: steps.ui_changed.outputs.changed == 'true'
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify UI publish appeared on registry
        if: steps.ui_changed.outputs.changed == 'true'
        run: |
          # pnpm publish does not fail loudly on duplicate-version no-ops in
          # pnpm 9+. Verify the version actually landed on the registry so
          # any future bump-logic regression fails the workflow loudly.
          package_name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if ! pnpm view "${package_name}@${version}" version 2>/dev/null; then
            echo "ERROR: ${package_name}@${version} did not appear on the registry after publish"
            exit 1
          fi
          echo "Verified ${package_name}@${version} on registry"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Publish worker package
        if: env.WORKER_PACKAGE_NAME != '' && steps.worker_changed.outputs.changed == 'true'
        run: pnpm --filter ${{ env.WORKER_PACKAGE_NAME }} publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify worker publish appeared on registry
        if: env.WORKER_PACKAGE_NAME != '' && steps.worker_changed.outputs.changed == 'true'
        run: |
          # See UI verify step for rationale.
          package_name=$(node -p "require('./worker/package.json').name")
          version=$(node -p "require('./worker/package.json').version")
          if ! pnpm view "${package_name}@${version}" version 2>/dev/null; then
            echo "ERROR: ${package_name}@${version} did not appear on the registry after publish"
            exit 1
          fi
          echo "Verified ${package_name}@${version} on registry"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Notify parent about deployment
        if: steps.ui_changed.outputs.changed == 'true' || steps.worker_changed.outputs.changed == 'true'
        env:
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          if [ -z "$HADOKU_SITE_TOKEN" ]; then
            echo "Warning: HADOKU_SITE_TOKEN not available, skipping notifications"
            exit 0
          fi

          API_URL="https://api.github.com/repos/WolffM/hadoku_site/dispatches"
          AUTH_HEADER="Authorization: Bearer $HADOKU_SITE_TOKEN"

          # Announce EXACTLY what was published, never what merely exists.
          #
          # This used to name the UI package unconditionally and the worker
          # package whenever WORKER_PACKAGE_NAME was non-empty — neither of which
          # is "did it publish". The consumer then tries to update a package that
          # may not be on the registry at all, and hadoku_site's Update Packages
          # dies with a 404 on `Fail on partial package update`.
          #
          # Fatal for a NEVER-published worker: hadoku-study's first publish
          # shipped @wolffm/study and announced @wolffm/study-worker alongside it,
          # so every study release reddened the parent until this was fixed
          # (2026-08-18). For an already-published worker it was merely a wasted
          # update of something that had not changed — same bug, quieter.
          #
          # Both `changed` outputs are exactly the conditions the publish steps
          # above are gated on, so the dispatch cannot disagree with reality.
          PACKAGES=""
          if [ "${{ steps.ui_changed.outputs.changed }}" = "true" ]; then
            PACKAGES="\"$PACKAGE_NAME\""
          fi
          if [ -n "$WORKER_PACKAGE_NAME" ] && [ "${{ steps.worker_changed.outputs.changed }}" = "true" ]; then
            [ -n "$PACKAGES" ] && PACKAGES="$PACKAGES, "
            PACKAGES="$PACKAGES\"$WORKER_PACKAGE_NAME\""
          fi
          if [ -z "$PACKAGES" ]; then
            echo "Nothing was published — no dispatch."
            exit 0
          fi


          # Dispatch packages_updated (triggers update-packages → deploy)
          echo "Dispatching packages_updated: [$PACKAGES]"
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "$API_URL" \
            -H "Accept: application/vnd.github+json" \
            -H "$AUTH_HEADER" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"event_type\": \"packages_updated\", \"client_payload\": {\"packages\": [$PACKAGES], \"sha\": \"${{ github.sha }}\", \"ref\": \"${{ github.ref }}\"}}")

          if [ "$status" = "204" ]; then
            echo "  packages_updated dispatched"
          else
            echo "  Failed to dispatch packages_updated (HTTP $status)"
          fi

          # Dispatch PM2 redeploy if configured
          if [ -n "$PM2_SERVICE_NAME" ]; then
            echo "Dispatching redeploy_service: $PM2_SERVICE_NAME"
            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X POST "$API_URL" \
              -H "Accept: application/vnd.github+json" \
              -H "$AUTH_HEADER" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "{\"event_type\": \"redeploy_service\", \"client_payload\": {\"service\": \"$PM2_SERVICE_NAME\", \"sha\": \"${{ github.sha }}\"}}")

            if [ "$status" = "204" ]; then
              echo "  redeploy_service dispatched"
            else
              echo "  Failed to dispatch redeploy_service (HTTP $status)"
            fi
          fi

      # A red run is seen by nobody unless it says so itself: nothing polls
      # these repos. `always()` so RECOVERIES report too -- without the success
      # side the alert state stays broken and the next real failure arrives as a
      # suppressed reminder rather than a new alert.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: study:publish
          service-key: ${{ secrets.KEY_SERVICE_STUDY }}
          started-at: ${{ env.JOB_STARTED_AT }}
